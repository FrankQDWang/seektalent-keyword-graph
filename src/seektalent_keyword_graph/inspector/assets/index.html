<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Snapshot Inspector</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main class="inspector-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SeekTalent Keyword Graph</p>
          <h1>Local Snapshot Inspector</h1>
        </div>
        <div class="snapshot-summary" id="snapshot-summary" aria-live="polite"></div>
      </header>

      <section class="query-panel" aria-labelledby="query-heading">
        <h2 id="query-heading">Query Recall</h2>
        <form id="query-form" class="query-form">
          <label>
            <span>Query Text</span>
            <input id="query-text" name="query_text" autocomplete="off" required>
          </label>
          <label>
            <span>Provider</span>
            <select id="provider" name="provider"></select>
          </label>
          <label>
            <span>Query Mode</span>
            <select id="query-mode" name="query_mode">
              <option value="keyword">keyword</option>
              <option value="exact">exact</option>
              <option value="phrase">phrase</option>
              <option value="boolean">boolean</option>
            </select>
          </label>
          <label>
            <span>Max Alternatives</span>
            <input id="max-alternatives" name="max_alternatives" type="number" min="0" max="50" value="10">
          </label>
          <button type="submit">Analyze</button>
        </form>
      </section>

      <section id="state" class="state" hidden></section>

      <section class="result-grid">
        <article class="panel">
          <h2>Input Observation</h2>
          <dl id="input-observation" class="kv-list"></dl>
        </article>
        <article class="panel">
          <h2>Recommendations</h2>
          <div id="recommendations"></div>
        </article>
      </section>

      <section class="panel">
        <h2>Alternatives</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Candidate</th>
                <th>Relation</th>
                <th>Confidence</th>
                <th>Concept</th>
                <th>Source Surface</th>
                <th>Target Surface</th>
                <th>Total</th>
                <th>Status</th>
                <th>Bucket</th>
                <th>Observed</th>
                <th>Evidence</th>
              </tr>
            </thead>
            <tbody id="alternatives"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2>Warnings And Provenance</h2>
        <div id="warnings"></div>
        <pre id="provenance"></pre>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
